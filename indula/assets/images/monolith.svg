<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="120" y="80" width="160" height="440" rx="4" fill="url(#block)" filter="url(#glow)"/>
  <rect x="120" y="80" width="160" height="440" rx="4" fill="none" stroke="#fff" stroke-opacity="0.3"/>
  <!-- plus markers -->
  <g stroke="#111" stroke-width="1.5" fill="none">
    <path d="M268 200 h8 M272 196 v8"/>
    <path d="M268 300 h8 M272 296 v8"/>
    <path d="M268 400 h8 M272 396 v8"/>
  </g>
</svg>
